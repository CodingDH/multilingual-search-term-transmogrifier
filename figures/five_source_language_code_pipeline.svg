<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="930" viewBox="0 0 1200 930" role="img" aria-labelledby="title desc">
  <title id="title">Language-Code Pipeline: Historical Build-Up and Metadata Enrichment</title>
  <desc id="desc">The project language inventory grew from 185 historical ISO 639-1 rows to 272 after Wikimedia, 465 after ISO 639-2, and 881 after CLDR. Later sources enrich, normalize, and review those rows without automatically adding languages.</desc>
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 16px Arial, sans-serif; fill: #44515e; }
      .section { font: 700 18px Arial, sans-serif; fill: #17212b; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #17212b; }
      .count { font: 700 26px Arial, sans-serif; fill: #17212b; }
      .body { font: 14px Arial, sans-serif; fill: #293641; }
      .small { font: 12px Arial, sans-serif; fill: #52606d; }
      .white-title { font: 700 20px Arial, sans-serif; fill: #ffffff; }
      .white-body { font: 14px Arial, sans-serif; fill: #ffffff; }
      .arrow { stroke: #596773; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
      .down-arrow { stroke: #73808b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); stroke-dasharray: 5 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#596773"/>
    </marker>
  </defs>

  <rect width="1200" height="930" fill="#ffffff"/>

  <text x="60" y="55" class="title">Language-Code Pipeline: Historical Build-Up and Metadata Enrichment</text>
  <text x="60" y="84" class="subtitle">Row selection followed a historical sequence; later registries and datasets supplied evidence without redefining the inventory.</text>

  <text x="60" y="130" class="section">1. Historical row construction</text>
  <text x="322" y="130" class="small">Each stage adds only codes absent from the preceding stages.</text>

  <rect x="60" y="150" width="245" height="205" rx="6" fill="#e8f1f7" stroke="#5b88a5" stroke-width="2"/>
  <text x="82" y="180" class="box-title">Historical ISO 639-1</text>
  <text x="82" y="214" class="count">+185</text>
  <text x="82" y="240" class="body">Cumulative: 185</text>
  <text x="82" y="273" class="body">Original two-letter-code</text>
  <text x="82" y="293" class="body">translation inventory</text>
  <line x1="82" y1="311" x2="283" y2="311" stroke="#9bb8ca"/>
  <text x="82" y="330" class="small">Historical baseline, not the current</text>
  <text x="82" y="346" class="small">187-row ISO 639-1 metadata flag.</text>

  <path d="M305 252 L335 252" class="arrow"/>

  <rect x="335" y="150" width="245" height="205" rx="6" fill="#e7f4ed" stroke="#4f9270" stroke-width="2"/>
  <text x="357" y="180" class="box-title">Wikimedia</text>
  <text x="357" y="214" class="count">+87</text>
  <text x="357" y="240" class="body">Cumulative: 272</text>
  <text x="357" y="273" class="body">Active community projects and</text>
  <text x="357" y="293" class="body">source-specific identifiers</text>
  <line x1="357" y1="311" x2="558" y2="311" stroke="#9fc5af"/>
  <text x="357" y="330" class="small">270 rows have Wikimedia evidence;</text>
  <text x="357" y="346" class="small">183 were already in the baseline.</text>

  <path d="M580 252 L610 252" class="arrow"/>

  <rect x="610" y="150" width="245" height="205" rx="6" fill="#fff2d9" stroke="#c38b2f" stroke-width="2"/>
  <text x="632" y="180" class="box-title">LOC ISO 639-2</text>
  <text x="632" y="214" class="count">+193</text>
  <text x="632" y="240" class="body">Cumulative: 465</text>
  <text x="632" y="273" class="body">Broader bibliographic language</text>
  <text x="632" y="293" class="body">and collective-code authority</text>
  <line x1="632" y1="311" x2="833" y2="311" stroke="#dfbd82"/>
  <text x="632" y="330" class="small">416 rows have ISO 639-2 evidence;</text>
  <text x="632" y="346" class="small">223 were already present.</text>

  <path d="M855 252 L885 252" class="arrow"/>

  <rect x="885" y="150" width="255" height="205" rx="6" fill="#f0eaf6" stroke="#8060a2" stroke-width="2"/>
  <text x="907" y="180" class="box-title">CLDR</text>
  <text x="907" y="214" class="count">+416</text>
  <text x="907" y="240" class="body">Final inventory: 881</text>
  <text x="907" y="270" class="body">+393 from CLDR 48.2</text>
  <text x="907" y="290" class="body">+23 retained from CLDR 45</text>
  <line x1="907" y1="311" x2="1118" y2="311" stroke="#c2b0d3"/>
  <text x="907" y="330" class="small">835 rows have CLDR evidence;</text>
  <text x="907" y="346" class="small">419 were already present.</text>

  <text x="60" y="405" class="section">2. The same sources also enrich rows already present</text>

  <rect x="60" y="425" width="1080" height="105" rx="6" fill="#f7f9fa" stroke="#bcc6ce"/>
  <rect x="85" y="439" width="330" height="76" rx="4" fill="#ffffff" stroke="#74a98b"/>
  <text x="103" y="464" class="box-title">Wikimedia · 183 prior rows</text>
  <text x="103" y="487" class="body">Community presence, project code,</text>
  <text x="103" y="507" class="body">and local naming</text>

  <rect x="435" y="439" width="300" height="76" rx="4" fill="#ffffff" stroke="#d0a050"/>
  <text x="453" y="464" class="box-title">ISO 639-2 · 223 prior rows</text>
  <text x="453" y="490" class="body">Bibliographic identifiers and registry authority</text>

  <rect x="755" y="439" width="360" height="76" rx="4" fill="#ffffff" stroke="#9478ae"/>
  <text x="773" y="464" class="box-title">CLDR · 419 prior rows</text>
  <text x="773" y="487" class="body">Scripts, directionality, local names,</text>
  <text x="773" y="507" class="body">and modern-use distinctions</text>

  <path d="M600 530 L600 560" class="down-arrow"/>
  <text x="60" y="580" class="section">3. Post-selection metadata, normalization, and review</text>
  <text x="60" y="601" class="small">These sources add evidence to selected rows; they do not automatically expand the 881-language inventory.</text>

  <rect x="60" y="620" width="200" height="100" rx="6" fill="#edf4f7" stroke="#7596a5"/>
  <text x="78" y="647" class="box-title">SIL / ISO 639-3</text>
  <text x="78" y="672" class="body">Reference-name fill and</text>
  <text x="78" y="692" class="body">identifier cross-checking</text>
  <text x="78" y="711" class="small">Not a row-selection source</text>

  <rect x="280" y="620" width="200" height="100" rx="6" fill="#f7f0df" stroke="#b79243"/>
  <text x="298" y="647" class="box-title">ISO 639-5 + Glottolog</text>
  <text x="298" y="672" class="body">Family evidence, conflict</text>
  <text x="298" y="692" class="body">review, and reconciliation</text>
  <text x="298" y="711" class="small">Reviewed rather than overwritten</text>

  <rect x="500" y="620" width="200" height="100" rx="6" fill="#eef0f7" stroke="#737da2"/>
  <text x="518" y="647" class="box-title">IANA / BCP 47</text>
  <text x="518" y="672" class="body">Canonical web tags and</text>
  <text x="518" y="692" class="body">legacy-code mappings</text>
  <text x="518" y="711" class="small">Applied through langcodes</text>

  <rect x="720" y="620" width="200" height="100" rx="6" fill="#f3edf4" stroke="#947596"/>
  <text x="738" y="647" class="box-title">Service manifests</text>
  <text x="738" y="672" class="body">Accepted codes and support</text>
  <text x="738" y="692" class="body">flags for translation systems</text>
  <text x="738" y="711" class="small">Preserves service differences</text>

  <rect x="940" y="620" width="200" height="100" rx="6" fill="#eaf4ed" stroke="#6b9978"/>
  <text x="958" y="647" class="box-title">Population evidence</text>
  <text x="958" y="672" class="body">CLDR estimates with</text>
  <text x="958" y="692" class="body">Wikidata fallback evidence</text>
  <text x="958" y="711" class="small">Unresolved rows remain explicit</text>

  <path d="M600 720 L600 758" class="arrow"/>

  <rect x="140" y="765" width="920" height="115" rx="7" fill="#263746" stroke="#17212b" stroke-width="2"/>
  <text x="170" y="797" class="white-title">Final project metadata: 881 stable language-code rows</text>
  <text x="170" y="824" class="white-body">Generated inventory:</text>
  <text x="170" y="846" class="white-body">language_codes_comprehensive.csv</text>
  <text x="485" y="824" class="white-body">Reviewed analysis layer:</text>
  <text x="485" y="846" class="white-body">language_codes_comprehensive_family_reviewed.csv</text>
  <text x="850" y="824" class="white-body">Provenance retained;</text>
  <text x="850" y="846" class="white-body">disagreements preserved.</text>

  <text x="60" y="912" class="small">Counts reproduce Notebook 01's source build-up logic and current reviewed metadata. Valid SIL or IANA entries do not automatically add rows.</text>
</svg>
